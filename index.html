<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERSON CONVERTER</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1329">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #141f3d;
            --accent-red: #d32f2f;
            --accent-blue: #1976d2;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3b5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .app-logo {
            width: 130px; 
            height: auto;
            margin-bottom: 10px;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 22px;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .header span {
            color: var(--accent-red);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: #1e293b;
            color: var(--text-muted);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-red);
            color: white;
        }

        .converter-card {
            display: none;
        }

        .converter-card.active {
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background-color: #0b1329;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        .result-box {
            background-color: #0b1329;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-top: 20px;
            text-align: center;
        }

        .result-box span {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
            word-wrap: break-word;
        }

        .offline-badge {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- Etiqueta de imagen limpia y directa -->
            <img src="logo.jpeg" alt="Logo de Person Services" class="app-logo">
            <h1>PERSON <span>CONVERTER</span></h1>
            <span style="font-size: 11px; color: var(--text-muted);">Conversor de Unidades Técnico</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'longitud')">Longitud</button>
            <button class="tab-btn" onclick="switchTab(event, 'peso')">Peso</button>
            <button class="tab-btn" onclick="switchTab(event, 'temperatura')">Temperatura</button>
            <button class="tab-btn" onclick="switchTab(event, 'presion')">Presión</button>
        </div>

        <!-- LONGITUD -->
        <div id="longitud" class="converter-card active">
            <div class="input-group">
                <label>Valor</label>
                <input type="number" id="val-long" value="1" oninput="convertLong()">
            </div>
            <div class="input-group">
                <label>De:</label>
                <select id="from-long" onchange="convertLong()">
                    <option value="m">Metros (m)</option>
                    <option value="km">Kilómetros (km)</option>
                    <option value="cm">Centímetros (cm)</option>
                    <option value="mm">Milímetros (mm)</option>
                    <option value="um">Micrómetros (µm)</option>
                    <option value="nm">Nanómetros (nm)</option>
                    <option value="mi">Millas (mi)</option>
                    <option value="yd">Yardas (yd)</option>
                    <option value="ft">Pies (ft)</option>
                    <option value="in">Pulgadas (in)</option>
                    <option value="nmi">Millas náuticas (nmi)</option>
                </select>
            </div>
            <div class="input-group">
                <label>A:</label>
                <select id="to-long" onchange="convertLong()">
                    <option value="ft">Pies (ft)</option>
                    <option value="m">Metros (m)</option>
                    <option value="km">Kilómetros (km)</option>
                    <option value="cm">Centímetros (cm)</option>
                    <option value="mm">Milímetros (mm)</option>
                    <option value="um">Micrómetros (µm)</option>
                    <option value="nm">Nanómetros (nm)</option>
                    <option value="mi">Millas (mi)</option>
                    <option value="yd">Yardas (yd)</option>
                    <option value="in">Pulgadas (in)</option>
                    <option value="nmi">Millas náuticas (nmi)</option>
                </select>
            </div>
            <div class="result-box">
                <span>Resultado</span>
                <div class="result-value" id="res-long">0</div>
            </div>
        </div>

        <!-- PESO -->
        <div id="peso" class="converter-card">
            <div class="input-group">
                <label>Valor</label>
                <input type="number" id="val-peso" value="1" oninput="convertPeso()">
            </div>
            <div class="input-group">
                <label>De:</label>
                <select id="from-peso" onchange="convertPeso()">
                    <option value="kg">Kilogramos (kg)</option>
                    <option value="g">Gramos (g)</option>
                    <option value="mg">Miligramos (mg)</option>
                    <option value="ug">Microgramos (µg)</option>
                    <option value="t">Toneladas métricas (t)</option>
                    <option value="lb">Libras (lb)</option>
                    <option value="oz">Onzas (oz)</option>
                    <option value="ct">Quilates (ct)</option>
                    <option value="uston">Toneladas cortas (US ton)</option>
                    <option value="ukton">Toneladas largas (UK ton)</option>
                </select>
            </div>
            <div class="input-group">
                <label>A:</label>
                <select id="to-peso" onchange="convertPeso()">
                    <option value="lb">Libras (lb)</option>
                    <option value="kg">Kilogramos (kg)</option>
                    <option value="g">Gramos (g)</option>
                    <option value="mg">Miligramos (mg)</option>
                    <option value="ug">Microgramos (µg)</option>
                    <option value="t">Toneladas métricas (t)</option>
                    <option value="oz">Onzas (oz)</option>
                    <option value="ct">Quilates (ct)</option>
                    <option value="uston">Toneladas cortas (US ton)</option>
                    <option value="ukton">Toneladas largas (UK ton)</option>
                </select>
            </div>
            <div class="result-box">
                <span>Resultado</span>
                <div class="result-value" id="res-peso">0</div>
            </div>
        </div>

        <!-- TEMPERATURA -->
        <div id="temperatura" class="converter-card">
            <div class="input-group">
                <label>Valor</label>
                <input type="number" id="val-temp" value="25" oninput="convertTemp()">
            </div>
            <div class="input-group">
                <label>De:</label>
                <select id="from-temp" onchange="convertTemp()">
                    <option value="c">Celsius (°C)</option>
                    <option value="f">Fahrenheit (°F)</option>
                    <option value="k">Kelvin (K)</option>
                    <option value="r">Rankine (°R)</option>
                </select>
            </div>
            <div class="input-group">
                <label>A:</label>
                <select id="to-temp" onchange="convertTemp()">
                    <option value="f">Fahrenheit (°F)</option>
                    <option value="c">Celsius (°C)</option>
                    <option value="k">Kelvin (K)</option>
                    <option value="r">Rankine (°R)</option>
                </select>
            </div>
            <div class="result-box">
                <span>Resultado</span>
                <div class="result-value" id="res-temp">0</div>
            </div>
        </div>

        <!-- PRESION -->
        <div id="presion" class="converter-card">
            <div class="input-group">
                <label>Valor</label>
                <input type="number" id="val-pres" value="1" oninput="convertPres()">
            </div>
            <div class="input-group">
                <label>De:</label>
                <select id="from-pres" onchange="convertPres()">
                    <option value="bar">Bar (bar)</option>
                    <option value="mbar">Milibar (mbar)</option>
                    <option value="pa">Pascal (Pa)</option>
                    <option value="kpa">Kilopascal (kPa)</option>
                    <option value="mpa">Megapascal (MPa)</option>
                    <option value="psi">PSI (lbf/in²)</option>
                    <option value="atm">Atmósfera (atm)</option>
                    <option value="torr">Torr (mmHg)</option>
                </select>
            </div>
            <div class="input-group">
                <label>A:</label>
                <select id="to-pres" onchange="convertPres()">
                    <option value="psi">PSI (lbf/in²)</option>
                    <option value="bar">Bar (bar)</option>
                    <option value="mbar">Milibar (mbar)</option>
                    <option value="pa">Pascal (Pa)</option>
                    <option value="kpa">Kilopascal (kPa)</option>
                    <option value="mpa">Megapascal (MPa)</option>
                    <option value="atm">Atmósfera (atm)</option>
                    <option value="torr">Torr (mmHg)</option>
                </select>
            </div>
            <div class="result-box">
                <span>Resultado</span>
                <div class="result-value" id="res-pres">0</div>
            </div>
        </div>

        <div class="offline-badge">
            🔒 Funciona 100% Offline / Sin Internet
        </div>
    </div>

    <script>
        function switchTab(evt, tabName) {
            var cards = document.querySelectorAll('.converter-card');
            for (var i = 0; i < cards.length; i++) {
                cards[i].classList.remove('active');
            }
            var buttons = document.querySelectorAll('.tab-btn');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].classList.remove('active');
            }
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function getUnitSymbol(selectId) {
            var select = document.getElementById(selectId);
            var text = select.options[select.selectedIndex].text;
            var match = text.match(/\(([^)]+)\)/);
            if (match) {
                return match[1];
            } else {
                return select.value;
            }
        }

        function formatResult(num, unitSymbol) {
            if (isNaN(num)) {
                return "0 " + unitSymbol;
            }
            if (num === 0) {
                return "0 " + unitSymbol;
            }
            try {
                var rounded = Number.parseFloat(num.toPrecision(7));
                var formatter = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 6 });
                return formatter.format(rounded) + " " + unitSymbol;
            } catch (e) {
                return num + " " + unitSymbol;
            }
        }

        var lengthToMeters = {
            m: 1, km: 1000, cm: 0.01, mm: 0.001, um: 0.000001, nm: 0.000000001,
            mi: 1609.344, yd: 0.9144, ft: 0.3048, in: 0.0254, nmi: 1852
        };

        var weightToKg = {
            kg: 1, g: 0.001, mg: 0.000001, ug: 0.000000001, t: 1000,
            lb: 0.45359237, oz: 0.028349523, ct: 0.0002,
            uston: 907.18474, ukton: 1016.0469
        };

        var pressureToPa = {
            pa: 1, kpa: 1000, mpa: 1000000, bar: 100000, mbar: 100,
            psi: 6894.757, atm: 101325, torr: 133.322368
        };

        function convertLong() {
            var valInput = document.getElementById('val-long').value;
            var val = parseFloat(valInput);
            if (isNaN(val)) val = 0;
            var from = document.getElementById('from-long').value;
            var to = document.getElementById('to-long').value;
            
            var inMeters = val * lengthToMeters[from];
            var res = inMeters / lengthToMeters[to];
            
            var unit = getUnitSymbol('to-long');
            document.getElementById('res-long').innerText = formatResult(res, unit);
        }

        function convertPeso() {
            var valInput = document.getElementById('val-peso').value;
            var val = parseFloat(valInput);
            if (isNaN(val)) val = 0;
            var from = document.getElementById('from-peso').value;
            var to = document.getElementById('to-peso').value;
            
            var inKg = val * weightToKg[from];
            var res = inKg / weightToKg[to];
            
            var unit = getUnitSymbol('to-peso');
            document.getElementById('res-peso').innerText = formatResult(res, unit);
        }

        function convertTemp() {
            var valInput = document.getElementById('val-temp').value;
            var val = parseFloat(valInput);
            if (isNaN(val)) val = 0;
            var from = document.getElementById('from-temp').value;
            var to = document.getElementById('to-temp').value;
            var inCelsius = 0;

            if (from === 'c') {
                inCelsius = val;
            } else if (from === 'f') {
                inCelsius = (val - 32) * 5/9;
            } else if (from === 'k') {
                inCelsius = val - 273.15;
            } else if (from === 'r') {
                inCelsius = (val - 491.67) * 5/9;
            }

            var res = 0;
            if (to === 'c') {
                res = inCelsius;
            } else if (to === 'f') {
                res = (inCelsius * 9/5) + 32;
            } else if (to === 'k') {
                res = inCelsius + 273.15;
            } else if (to === 'r') {
                res = (inCelsius + 273.15) * 9/5;
            }

            var unit = getUnitSymbol('to-temp');
            document.getElementById('res-temp').innerText = formatResult(res, unit);
        }

        function convertPres() {
            var valInput = document.getElementById('val-pres').value;
            var val = parseFloat(valInput);
            if (isNaN(val)) val = 0;
            var from = document.getElementById('from-pres').value;
            var to = document.getElementById('to-pres').value;
            
            var inPa = val * pressureToPa[from];
            var res = inPa / pressureToPa[to];
            
            var unit = getUnitSymbol('to-pres');
            document.getElementById('res-pres').innerText = formatResult(res, unit);
        }

        convertLong();
        convertPeso();
        convertTemp();
        convertPres();
    </script>
</body>
</html>
