<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERSON CONVERTER</title>
    
    <!-- Configuración del ícono para el celular -->
    <link rel="apple-touch-icon" href="logo.jpeg">
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b1329">
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #141f3d;
            --accent-red: #d32f2f;
            --accent-blue: #1976d2;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3b5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .app-logo {
            width: 130px; 
            height: auto;
            margin-bottom: 10px;
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 22px;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .header span {
            color: var(--accent-red);
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background-color: #1e293b;
            color: var(--text-muted);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-red);
            color: white;
        }

        .converter-card {
            display: none;
        }

        .converter-card.active
